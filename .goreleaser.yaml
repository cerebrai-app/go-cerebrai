# GoReleaser config for brainctl and workctl, used by the shared go-release.yml
# workflow (see .github/workflows/release.yml). Both programs share the tag's
# version. The workflow publishes the GitHub Release itself, then reruns
# GoReleaser to push the Homebrew casks and Scoop manifests, so the archives
# must rebuild byte for byte (mod_timestamp, -trimpath, fixed archive mtimes).
# Check changes with `goreleaser check` and
# `goreleaser release --snapshot --clean --skip=publish`.
version: 2

builds:
  - &build
    id: brainctl
    main: ./cmd/brainctl
    binary: brainctl
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/cerebrai-app/go-cerebrai/internal/buildinfo.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
  - <<: *build
    id: workctl
    main: ./cmd/workctl
    binary: workctl

archives:
  - &archive
    id: brainctl
    ids: [brainctl]
    name_template: "{{ .Binary }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    wrap_in_directory: true
    # Fixed timestamps, so a rebuild of the same commit gives byte-identical
    # archives (the publish job relies on it; see go-release.yml).
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: README.md
        info: { mtime: "{{ .CommitDate }}" }
      - src: LICENSE
        info: { mtime: "{{ .CommitDate }}" }
  - <<: *archive
    id: workctl
    ids: [workctl]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: 0.0.0-dev

# The shared release workflow creates the GitHub Release itself, so
# GoReleaser only builds and never needs a token that can write.
changelog:
  disable: true
release:
  disable: true

homebrew_casks:
  - &cask
    name: brainctl
    ids: [brainctl]
    binaries: [brainctl]
    description: brainctl command line interface
    homepage: https://github.com/cerebrai-app/go-cerebrai
    license: Apache-2.0
    url:
      template: &url "https://github.com/cerebrai-app/go-cerebrai/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    repository: &tap
      owner: cerebrai-app
      name: homebrew-tap
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    commit_author: &author
      name: cerebrai-release[bot]
      email: noreply@github.com
    commit_msg_template: "brainctl {{ .Tag }}"
    skip_upload: auto # no prereleases
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/brainctl"]
          end
  - <<: *cask
    name: workctl
    ids: [workctl]
    binaries: [workctl]
    description: workctl command line interface
    commit_msg_template: "workctl {{ .Tag }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/workctl"]
          end

scoops:
  - &scoop
    name: brainctl
    ids: [brainctl]
    description: brainctl command line interface
    homepage: https://github.com/cerebrai-app/go-cerebrai
    license: Apache-2.0
    url_template: *url
    repository:
      <<: *tap
      name: scoop-bucket
    commit_author: *author
    commit_msg_template: "brainctl {{ .Tag }}"
    skip_upload: auto
  - <<: *scoop
    name: workctl
    ids: [workctl]
    description: workctl command line interface
    commit_msg_template: "workctl {{ .Tag }}"
