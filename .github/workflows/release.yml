name: Release

# Pushing a tag like v0.1.0 builds brainctl and workctl for each platform and
# publishes them together in one GitHub Release (see the shared go-release.yml).
# Pull requests that change this file run everything except the publish, so a
# change is checked before a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    # Pinned like ci.yml; repin both together.
    uses: cerebrai-app/actions/.github/workflows/go-release.yml@26f248df798e644cdfcb17db4fdbbd385ef30908
    permissions:
      contents: write # the publish job creates the release
    with:
      main-packages: ./cmd/brainctl ./cmd/workctl
