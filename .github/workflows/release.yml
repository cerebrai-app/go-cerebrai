name: Release

# Pushing a tag like v0.1.0 builds brainctl and workctl for each platform with
# GoReleaser (.goreleaser.yaml) and publishes them together in one GitHub
# Release (see the shared go-release.yml). Every pull request builds a snapshot
# and checks the tap app (its installation on homebrew-tap and scoop-bucket,
# and the RELEASE_APP_* secrets), and publishes nothing, so a broken release
# shows up before a tag.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    uses: cerebrai-app/actions/.github/workflows/go-release.yml@a0a097e0166c34eba18e839b3856b6fcbe5bd6e8 # v3.2.0
    permissions:
      contents: write # create the release
      id-token: write # sign the build attestations
      attestations: write # store them
    with:
      tap-repositories: homebrew-tap,scoop-bucket
    secrets:
      tap-app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      tap-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
