name: Release

# Pushing a tag like v0.1.0 builds brainctl and workctl for each platform with
# GoReleaser (.goreleaser.yaml) and publishes them together in one GitHub
# Release (see the shared go-release.yml). Pull requests that change this file
# or .goreleaser.yaml build a snapshot and publish nothing, so a change is
# checked before a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", ".goreleaser.yaml"]

permissions:
  contents: read

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    # Pinned to the cerebrai-app/actions commit that moves releases to
    # GoReleaser, which is not in a release yet. Once it is, pin to that
    # release's commit with the tag as a comment (`@<sha> # v2.0.0`).
    uses: cerebrai-app/actions/.github/workflows/go-release.yml@a4cffa1901d97e83c7961a618bb4924f99049045
    permissions:
      contents: write # the publish job creates the release
