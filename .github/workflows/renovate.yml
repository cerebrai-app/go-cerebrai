name: Renovate

# Self-hosted Renovate (see renovate.json). Runs weekly, and can be started by
# hand from the Actions tab with an optional dry run. The app secrets it needs
# are described in https://github.com/cerebrai-app/actions/tree/main/renovate.

on:
  schedule:
    - cron: "41 4 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: log what would change without opening PRs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: cerebrai-app/actions/renovate@fc8276cb9f2ede323a356ea1510bdb407574bdc6 # v1.1.0
        with:
          app-client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          dry-run: ${{ inputs.dry_run }}
