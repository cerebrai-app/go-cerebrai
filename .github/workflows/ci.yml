name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Pinned to the cerebrai-app/actions commit with the multi-program Go
    # workflows, which are not in a release yet. Once they are, pin to that
    # release's commit with the tag as a comment (`@<sha> # v1.1.0`) so
    # Renovate can keep it current.
    uses: cerebrai-app/actions/.github/workflows/go-ci.yml@26f248df798e644cdfcb17db4fdbbd385ef30908
    with:
      main-packages: ./cmd/brainctl ./cmd/workctl
      smoke-test-args: version
