name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: cerebrai-app/actions/.github/workflows/go-ci.yml@fc8276cb9f2ede323a356ea1510bdb407574bdc6 # v1.1.0
    with:
      main-packages: ./cmd/brainctl ./cmd/workctl
      smoke-test-args: version
