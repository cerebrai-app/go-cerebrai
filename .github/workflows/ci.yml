name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: cerebrai-app/actions/.github/workflows/go-ci.yml@da96b5c774508e239ab5f47a44af71a77381484c # v3.3.1
    with:
      main-packages: ./cmd/brainctl ./cmd/workctl
      # Until the pinned go-ci.yml includes windows/arm64 by default.
      targets: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
      smoke-test-args: version
