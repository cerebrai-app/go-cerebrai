name: CI

# Checks every push to main and every pull request with the Go actions from
# cerebrai-app/actions, one job each, so they run in parallel.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cerebrai-app/actions/go-lint@f77820212d8342bc94bd90390056356670afc0e3 # v4.3.0

  # The latest stable Go with the race detector and a smoke test, and exactly
  # the go version from go.mod, so the declared minimum is a tested one; each
  # on Linux, macOS and Windows, whose file locks and permissions differ.
  # go-test runs Windows without the race detector.
  test:
    name: Test (${{ matrix.platform.name }}, ${{ matrix.go }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: Linux, runner: ubuntu-latest}
          - {name: macOS, runner: macos-latest}
          - {name: Windows, runner: windows-latest}
        go: [stable, go.mod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cerebrai-app/actions/go-test@f77820212d8342bc94bd90390056356670afc0e3 # v4.3.0
        with:
          go-version: ${{ matrix.go }}
          race: ${{ matrix.go == 'stable' }}
          main-packages: ./cmd/brainctl ./cmd/workctl
          smoke-test-args: ${{ matrix.go == 'stable' && 'version' || '' }}

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cerebrai-app/actions/go-cross-build@f77820212d8342bc94bd90390056356670afc0e3 # v4.3.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cerebrai-app/actions/govulncheck@f77820212d8342bc94bd90390056356670afc0e3 # v4.3.0
