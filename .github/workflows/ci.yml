name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Pinned to the cerebrai-app/actions commit that adds go-ci.yml, which is
    # not in a release yet. Once it is, pin to that release's commit with the
    # tag as a comment (`@<sha> # v1.1.0`) so Renovate can keep it current.
    uses: cerebrai-app/actions/.github/workflows/go-ci.yml@b749c995cde7760a0d82b0edf9235000dcc3d529
