name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# The two reviews are separate jobs so they run in parallel and one failing
# doesn't stop the other.
jobs:
  ponytail-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: cerebrai-app/actions/ponytail-review@fc8276cb9f2ede323a356ea1510bdb407574bdc6 # v1.1.0
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: cerebrai-app/actions/claude-review@fc8276cb9f2ede323a356ea1510bdb407574bdc6 # v1.1.0
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # A separate job on purpose: it needs write access to comments, and the job
  # that runs the third-party plugin should not have that. It runs only after a
  # successful review, so a failed review never hides the last report.
  minimize-old-ponytail-reviews:
    needs: ponytail-review
    if: ${{ needs.ponytail-review.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: cerebrai-app/actions/minimize-ponytail-reviews@fc8276cb9f2ede323a356ea1510bdb407574bdc6 # v1.1.0
