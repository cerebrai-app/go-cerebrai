name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Skip PRs that only touch CI config, such as Renovate's action pin bumps.
    # A PR that also changes anything outside .github/ is still reviewed.
    paths-ignore: [".github/**"]

# The two reviews are separate jobs so they run in parallel and one failing
# doesn't stop the other.
jobs:
  ponytail-review:
    # Skip PRs opened by bots such as Renovate: claude-code-action refuses bot
    # actors, and their PR text (e.g. upstream release notes) should not reach Claude.
    if: ${{ github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: cerebrai-app/actions/ponytail-review@1f3c4aea891f239f2e2f6276908648ee08416739 # v3.6.1
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  claude-review:
    # Skip PRs opened by bots such as Renovate: claude-code-action refuses bot
    # actors, and their PR text (e.g. upstream release notes) should not reach Claude.
    if: ${{ github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: cerebrai-app/actions/claude-review@1f3c4aea891f239f2e2f6276908648ee08416739 # v3.6.1
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # A separate job on purpose: it needs write access to comments, and the job
  # that runs the third-party plugin should not have that. It runs only after a
  # successful review, so a failed review never hides the last report.
  minimize-old-ponytail-reviews:
    needs: ponytail-review
    if: ${{ needs.ponytail-review.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: cerebrai-app/actions/minimize-ponytail-reviews@1f3c4aea891f239f2e2f6276908648ee08416739 # v3.6.1
